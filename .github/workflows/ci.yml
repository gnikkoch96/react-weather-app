name: CI
# Run CI on pushes and pull requests to main
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  ci: 
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Lint
      run: npm run lint
    - name: Build
      run: npm run build
    - name: Unit Tests  
      run: npm run test
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run E2E Tests
      run: npx playwright test
